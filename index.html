<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐，王星琪！🎂</title>
    <meta property="og:title" content="生日快乐，王星琪！🎂">
    <meta property="og:description" content="这是我们的小小纪念册 ✨ 21岁生日快乐！">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://raw.githubusercontent.com/YuLin-727/birthday-wxq/main/photos/01-%E5%88%9D%E8%AF%86/IMG20250413143011.jpg">
    <meta name="description" content="这是我们的小小纪念册 ✨ 王星琪21岁生日快乐！">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #FFB7C5;
            --lavender: #C9B8E8;
            --mint: #B8E8D0;
            --peach: #FFD4B8;
            --bg: #FFF9F0;
            --text: #4A3728;
            --border: #8B6F5E;
            --paper: #FFFDF5;
            --shadow: rgba(74,55,40,0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Caveat', cursive;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, #d4a8a0 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.2;
            pointer-events: none;
            z-index: 0;
        }

        /* ===== Hero ===== */
        .hero {
            text-align: center;
            padding: 50px 20px 30px;
            position: relative;
            z-index: 1;
        }
        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 700;
            text-shadow: 3px 3px 0 var(--pink);
            line-height: 1.2;
        }
        .hero .title-stars {
            display: block;
            font-size: clamp(1.6rem, 4vw, 2.8rem);
            line-height: 1;
            margin-bottom: 4px;
            letter-spacing: 0.3em;
            animation: titleStars 2s ease-in-out infinite;
        }
        .hero .title-stars span {
            display: inline-block;
            animation: titleStarBounce 2s ease-in-out infinite;
        }
        .hero .title-stars span:nth-child(odd) { animation-delay: 0.3s; }
        .hero .title-stars span:nth-child(even) { animation-delay: 0.8s; }
        @keyframes titleStars {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
        @keyframes titleStarBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(10deg); }
        }
        .hero .subtitle {
            font-size: clamp(1.1rem, 3vw, 1.6rem);
            color: #8B6F5E;
            margin-top: 10px;
        }
        .deco {
            position: absolute;
            font-size: 2rem;
            animation: float 3s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-5deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }

        /* ===== Scrapbook ===== */
        .album-wrap {
            max-width: 960px;
            margin: 10px auto 0;
            padding: 0 16px;
            position: relative;
            z-index: 1;
        }
        .book {
            position: relative;
            background: var(--paper);
            border: 3px solid var(--border);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            box-shadow: 8px 8px 0 var(--shadow), 0 4px 20px rgba(0,0,0,0.06);
            padding: 32px 28px 20px;
            min-height: 520px;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .book.fade-out {
            opacity: 0;
            transform: translateX(-30px) rotate(-1deg);
        }
        .book.fade-in {
            opacity: 0;
            transform: translateX(30px) rotate(1deg);
        }
        .book.book-enter {
            opacity: 0;
            transform: scale(0.92);
            animation: bookEnter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes bookEnter {
            0% { opacity: 0; transform: scale(0.92) translateY(30px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Book binding visual */
        .book::before {
            content: '';
            position: absolute;
            left: 18px;
            top: 10px;
            bottom: 10px;
            width: 4px;
            background: repeating-linear-gradient(
                to bottom,
                var(--border) 0px, var(--border) 4px,
                transparent 4px, transparent 8px
            );
            opacity: 0.25;
        }

        /* Page header */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            font-size: 1.1rem;
            padding-left: 10px;
        }
        .page-number {
            color: #bbb;
            font-size: 0.95rem;
        }

        /* ===== Like Button ===== */
        .like-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'Caveat', cursive;
            font-size: 1.1rem;
            background: none;
            border: 2px solid var(--pink);
            border-radius: 30px;
            padding: 4px 16px 4px 12px;
            cursor: pointer;
            color: var(--text);
            transition: all 0.2s;
        }
        .like-btn:hover { background: var(--pink); transform: scale(1.05); }
        .like-btn.liked { background: var(--pink); }
        .like-btn .heart { font-size: 1.2rem; transition: transform 0.2s; }
        .like-btn.liked .heart { animation: heartPop 0.3s ease; }
        @keyframes heartPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); }
        }

        /* ===== Content Layout ===== */
        .page-content {
            display: flex;
            gap: 28px;
            align-items: flex-start;
            min-height: 340px;
        }
        .page-content.layout-right {
            flex-direction: row-reverse;
        }
        .page-content.layout-center {
            flex-direction: column;
            align-items: center;
        }
        .page-content.layout-center .photos-area {
            flex: none;
            width: 100%;
            max-width: 480px;
        }
        .page-content.layout-center .text-area {
            flex: none;
            width: 100%;
            max-width: 600px;
        }

        .photos-area {
            flex: 1;
            min-width: 180px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-content: flex-start;
        }
        .text-area {
            flex: 0 0 280px;
            max-width: 340px;
            min-width: 0;
        }

        /* ===== Photos ===== */
        .photo-item {
            border: 4px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1), 0 0 0 2px var(--border);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
            transition: transform 0.2s;
            background: linear-gradient(110deg, #f5ede4 30%, #ede3d8 50%, #f5ede4 70%);
            background-size: 200% 100%;
            animation: skeletonShimmer 1.5s ease-in-out infinite;
        }
        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: white;
        }
        @keyframes skeletonShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .photo-item.tilt-l { transform: rotate(-2deg); }
        .photo-item.tilt-r { transform: rotate(2deg); }
        .photo-item.tilt-l:hover,
        .photo-item.tilt-r:hover { transform: rotate(0) scale(1.03); z-index: 2; }

        /* Photo sizes */
        .photo-item.w-large {
            width: 100%;
        }
        .photo-item.w-med {
            width: calc(50% - 7px);
            flex: 0 0 auto;
        }
        .photo-item.w-small {
            width: calc(33.33% - 10px);
            flex: 0 0 auto;
        }

        /* Photo caption */
        .photo-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 6px 4px;
            background: linear-gradient(transparent, rgba(0,0,0,0.4));
            color: white;
            font-size: 0.72rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
        .photo-item:hover .photo-caption { opacity: 1; }

        /* ===== Text ===== */
        .page-title {
            font-size: clamp(1.4rem, 3vw, 1.9rem);
            font-weight: 700;
            color: var(--border);
            line-height: 1.3;
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
        }
        .page-title::after {
            content: '';
            display: block;
            height: 3px;
            background: var(--pink);
            border-radius: 2px;
            margin-top: 2px;
            transform: rotate(-1deg);
        }
        .page-text {
            font-size: clamp(1rem, 2vw, 1.2rem);
            line-height: 1.7;
            color: var(--text);
            white-space: pre-wrap;
        }
        .page-text .highlight {
            background: linear-gradient(180deg, transparent 60%, rgba(255,183,197,0.35) 60%);
            padding: 0 4px;
        }

        /* ===== Audio Player ===== */
        .audio-area {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 2px dashed var(--lavender);
        }
        .audio-player {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            padding: 6px 14px;
            background: rgba(201,184,232,0.15);
            border-radius: 30px;
            border: 2px solid var(--lavender);
        }
        .audio-player .play-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--lavender);
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.15s;
        }
        .audio-player .play-btn:hover { transform: scale(1.12); }
        .audio-player .play-btn.playing { background: var(--pink); }
        .audio-label {
            flex: 1;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .audio-progress {
            flex: 1;
            height: 4px;
            background: rgba(0,0,0,0.08);
            border-radius: 2px;
            position: relative;
            min-width: 60px;
            cursor: pointer;
        }
        .audio-progress-bar {
            height: 100%;
            background: var(--pink);
            border-radius: 2px;
            width: 0%;
            transition: width 0.1s linear;
        }
        .audio-time {
            font-size: 0.8rem;
            color: #aaa;
            white-space: nowrap;
        }

        /* ===== Navigation ===== */
        .nav-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 2px dashed #e8ddd0;
        }
        .nav-arrow {
            font-size: 1.6rem;
            background: none;
            border: 2px solid var(--border);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--border);
            transition: all 0.15s;
            font-family: inherit;
        }
        .nav-arrow:hover { background: var(--pink); border-color: var(--pink); color: white; transform: scale(1.08); }
        .nav-arrow:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
        .nav-arrow:disabled:hover { background: none; border-color: var(--border); color: var(--border); }

        .nav-dots {
            display: flex;
            gap: 8px;
        }
        .nav-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--border);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s;
            padding: 0;
        }
        .nav-dot.active {
            background: var(--pink);
            border-color: var(--pink);
            transform: scale(1.2);
        }
        .nav-dot:hover:not(.active) { background: var(--lavender); border-color: var(--lavender); }

        /* ===== Comments ===== */
        .comments-section {
            max-width: 700px;
            margin: 40px auto 0;
            padding: 0 16px 60px;
            position: relative;
            z-index: 1;
        }
        .section-title {
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            font-weight: 700;
            text-align: center;
            display: block;
            margin-bottom: 24px;
        }
        .section-title::after {
            content: '';
            display: block;
            height: 4px;
            width: 50%;
            background: var(--pink);
            border-radius: 2px;
            margin: 4px auto 0;
            transform: rotate(-1deg);
        }
        .message-form {
            background: white;
            border: 3px solid var(--border);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            padding: 28px;
            margin-bottom: 32px;
        }
        .message-form input,
        .message-form textarea {
            width: 100%;
            font-family: 'Caveat', cursive;
            font-size: 1.1rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 12px;
            background: var(--bg);
            color: var(--text);
            outline: none;
            resize: vertical;
        }
        .message-form input:focus,
        .message-form textarea:focus { border-color: var(--pink); background: white; }
        .message-form button {
            font-family: 'Caveat', cursive;
            font-size: 1.2rem;
            font-weight: 700;
            background: var(--pink);
            color: var(--text);
            border: 3px solid var(--border);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            padding: 10px 28px;
            cursor: pointer;
            transition: transform 0.15s, background 0.15s;
        }
        .emoji-row {
            display: flex;
            gap: 6px;
            margin: -4px 0 10px;
            flex-wrap: wrap;
        }
        .emoji-btn {
            font-size: 1.3rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 8px;
            transition: transform 0.15s, background 0.15s;
            user-select: none;
        }
        .emoji-btn:hover { transform: scale(1.25); background: rgba(0,0,0,0.04); }
        .emoji-btn:active { transform: scale(0.9); }
        .message-form button:hover { transform: scale(1.05) rotate(-1deg); background: var(--lavender); }
        .messages-list { display: flex; flex-direction: column; gap: 14px; }
        .bubble-settled-area .bubble.highlight-msg {
            animation: msgHighlight 2s ease !important;
        }
        @keyframes msgHighlight {
            0%, 100% { box-shadow: 0 0 0 rgba(255,183,197,0); }
            20% { box-shadow: 0 0 0 8px rgba(255,183,197,0.5); }
            50% { box-shadow: 0 0 0 4px rgba(255,183,197,0.15); }
        }
        .message-card {
            background: white;
            border: 2px solid var(--border);
            border-radius: 15px 255px 15px 225px/225px 15px 255px 15px;
            padding: 16px 20px;
        }
        .message-card:nth-child(6n+1) { transform: rotate(-0.5deg); background: #FFF5F8; border-color: #FFB7C5; }
        .message-card:nth-child(6n+2) { transform: rotate(0.5deg);  background: #F8F5FF; border-color: #C9B8E8; }
        .message-card:nth-child(6n+3) { transform: rotate(-0.3deg); background: #F0FFF8; border-color: #B8E8D0; }
        .message-card:nth-child(6n+4) { transform: rotate(0.4deg);  background: #FFF8F0; border-color: #FFD4B8; }
        .message-card:nth-child(6n+5) { transform: rotate(-0.6deg); background: #FFFFF0; border-color: #E8E0A0; }
        .message-card:nth-child(6n+0) { transform: rotate(0.3deg);  background: #F5F0FF; border-color: #D4B8E8; }
        .message-card .name  { font-size: 1.05rem; font-weight: 700; color: #8B6F5E; }
        .message-card .text  { font-size: 1.1rem; line-height: 1.5; margin-top: 2px; }
        .message-card .time  { font-size: 0.8rem; color: #bbb; margin-top: 6px; }

                .hero-stars-row {
            display: flex;
            justify-content: center;
            gap: 0.4em;
            font-size: clamp(1.2rem, 3vw, 2rem);
            margin-bottom: 8px;
        }
        .hero-stars-row span {
            display: inline-block;
            animation: titleStarBounce 2.5s ease-in-out infinite;
        }
        .hero-stars-row span:nth-child(3n) { animation-delay: 0.2s; }
        .hero-stars-row span:nth-child(3n+1) { animation-delay: 0.6s; }
        .hero-stars-row span:nth-child(3n+2) { animation-delay: 1s; }
        /* ===== BGM Button ===== */
        .bgm-btn {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 3px solid var(--border);
            background: var(--paper);
            color: var(--text);
            font-size: 1.4rem;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
            font-family: inherit;
        }
        .bgm-btn:hover { transform: scale(1.12); background: var(--pink); }
        .bgm-btn.playing { background: var(--pink); animation: pulse 2s ease-in-out infinite; }
        .top-btn {
            position: fixed;
            bottom: 24px;
            left: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 3px solid var(--border);
            background: var(--paper);
            color: var(--text);
            font-size: 1.3rem;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            display: none;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
            font-family: inherit;
            line-height: 1;
        }
        .top-btn:hover { transform: scale(1.12) translateY(-2px); background: var(--lavender); }
        .top-btn.show { display: flex; }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
            50% { box-shadow: 0 4px 24px rgba(255,183,197,0.5); }
        }
/* ===== Confetti ===== */
        .confetti-piece {
            position: fixed;
            width: 10px; height: 10px;
            top: -10px;
            border-radius: 2px;
            animation: confetti-fall linear forwards;
            pointer-events: none;
            z-index: 999;
        }
        @keyframes confetti-fall {
            to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 1rem;
            color: #bbb;
            position: relative;
            z-index: 1;
        }

                /* ===== Quiz Overlay ===== */
        .quiz-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: var(--bg);
            background-image: radial-gradient(circle, #d4a8a0 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, transform 0.6s ease;
            overflow-y: auto;
            padding: 20px;
        }
        .quiz-overlay.hidden {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }
        .quiz-scene {
            background: var(--paper);
            border: 3px solid var(--border);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            box-shadow: 8px 8px 0 var(--shadow), 0 4px 20px rgba(0,0,0,0.06);
            padding: 40px 36px 36px;
            max-width: 520px;
            width: 100%;
            position: relative;
            text-align: center;
        }
        .quiz-scene::before {
            content: '';
            position: absolute;
            left: 18px;
            top: 12px;
            bottom: 12px;
            width: 3px;
            background: repeating-linear-gradient(to bottom, var(--border) 0px, var(--border) 3px, transparent 3px, transparent 7px);
            opacity: 0.2;
        }
        .quiz-title {
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            font-weight: 700;
            margin-bottom: 6px;
        }
        .quiz-title::after {
            content: '';
            display: block;
            height: 3px;
            width: 60%;
            background: var(--pink);
            border-radius: 2px;
            margin: 4px auto 0;
            transform: rotate(-1deg);
        }
        .quiz-subtitle {
            font-size: 1.05rem;
            color: #8B6F5E;
            margin-bottom: 24px;
        }
        .quiz-progress {
            font-size: 0.95rem;
            color: #bbb;
            margin-bottom: 16px;
        }
        .quiz-question {
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            font-weight: 600;
            color: var(--border);
            margin-bottom: 20px;
            min-height: 50px;
            line-height: 1.4;
        }
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .quiz-option {
            font-family: 'Caveat', cursive;
            font-size: 1.15rem;
            background: white;
            border: 2px solid var(--border);
            border-radius: 15px 255px 15px 225px/225px 15px 255px 15px;
            padding: 12px 20px;
            cursor: pointer;
            color: var(--text);
            transition: all 0.15s;
            text-align: left;
        }
        .quiz-option:hover {
            background: var(--pink);
            border-color: var(--pink);
            transform: scale(1.02);
        }
        .quiz-option.correct {
            background: var(--mint);
            border-color: #7DC4A0;
        }
        .quiz-option.wrong {
            background: #FFB7B7;
            border-color: #E88;
            animation: shake 0.4s ease;
        }
        .quiz-option:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        .quiz-option:disabled:hover {
            transform: none;
            background: inherit;
            border-color: inherit;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px) rotate(-1deg); }
            40% { transform: translateX(8px) rotate(1deg); }
            60% { transform: translateX(-5px); }

                allCorrect();

}

    // ===== Render Page =====
    function renderPage(index, direction, opts) {
        opts = opts || {};
        if (animating) return;
        const book = document.getElementById('book');
        const page = pages[index];
        if (!page) return;

        animating = true;
        if (!opts.noFadeOut) {
            book.classList.add('fade-out');
        }

        setTimeout(() => {
            // Stop any playing audio
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                isPlaying = false;
            }

            // Content
            const container = document.getElementById('pageContent');
            container.innerHTML = '';

            // Build photos
            const photosHtml = page.photos.map(p => {
                const sizeClass = p.size === 'large' ? 'w-large' : p.size === 'small' ? 'w-small' : 'w-med';
                return `<div class="photo-item ${p.tilt || 'tilt-l'} ${sizeClass}" style="cursor:pointer">
                    <img src="${encodeURI(PHOTO_BASE + p.src)}" alt="" loading="lazy" onclick="openLightbox('${encodeURI(PHOTO_BASE + p.src)}')" onerror="this.outerHTML='<div style=display:flex;align-items:center;justify-content:center;height:100%;background:#f5ede4;color:#bbb;font-size:0.9rem;padding:20px>' + '${encodeURI(p.src)}'.split('/').pop() + '<br></div>'">
                    ${p.caption ? `<div class="photo-caption">${esc(p.caption)}</div>` : ''}
                </div>`;
            }).join('');

            // Build audio
            let audioHtml = '';
            if (page.audio) {
                audioHtml = `
                    <div class="audio-area">
                        <div class="audio-player">
                            <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
                            <span class="audio-label">${esc(page.audio.label)}</span>
                            <div class="audio-progress" id="progressBar" onclick="seekAudio(event)">
                                <div class="audio-progress-bar" id="progressFill"></div>
                            </div>
                            <span class="audio-time" id="audioTime">0:00</span>
                        </div>
                    </div>`;
            }

            // Determine layout
            const layoutClass = page.photos.length >= 3 ? 'layout-right' : (index % 2 === 0 ? '' : 'layout-right');
            container.className = `page-content ${layoutClass}`;

            container.innerHTML = `
                <div class="photos-area">${photosHtml}</div>
                <div class="text-area">
                    <div class="page-title">${page.title}</div>
                    <div class="page-text">${page.text}</div>
                    ${audioHtml}
                </div>
            `;

            // Setup audio if exists
            if (page.audio) {
                currentAudio = new Audio(page.audio.src);
                currentAudio.addEventListener('timeupdate', updateAudioProgress);
                currentAudio.addEventListener('ended', () => {
                    isPlaying = false;
                    const btn = document.getElementById('playBtn');
                    if (btn) btn.textContent = '▶';
                    btn.classList.remove('playing');
                });
            } else {
                currentAudio = null;
            }

            // Page number, dots, navigation
            document.getElementById('pageNum').textContent = `${index + 1} / ${pages.length}`;
            document.getElementById('prevBtn').disabled = index === 0;
            document.getElementById('nextBtn').disabled = index === pages.length - 1;

            const dots = document.getElementById('navDots');
            dots.innerHTML = pages.map((_, i) =>
                `<button class="nav-dot ${i === index ? 'active' : ''}" onclick="goToPage(${i})"></button>`
            ).join('');

            // Like state
            updateLikeBtn(index);

            // Transition in
            if (opts.noFadeOut) {
                book.classList.add('book-enter');
                requestAnimationFrame(() => {
                    book.classList.remove('book-enter');
                    animating = false;
                });
            } else {
                book.classList.remove('fade-out');
                book.classList.add('fade-in');
                requestAnimationFrame(() => {
                    book.classList.remove('fade-in');
                    animating = false;
                    staggerPageContent();
                });
            }
        }, opts.noFadeOut ? 50 : 300);
    }

    // ===== Stagger entrance for page items =====
    function staggerPageContent() {
        var items = document.querySelectorAll('.page-content .photo-item, .page-content .text-area > *');
        items.forEach(function(el, i) {
            el.style.opacity = '0';
            el.style.transform = 'translateY(20px)';
            el.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
            el.style.transitionDelay = (0.1 + i * 0.08) + 's';
            requestAnimationFrame(function() {
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
            });
        });
    }

        // ===== Navigation =====
    function goToPage(idx) {
        if (idx < 0 || idx >= pages.length || animating) return;
        currentPage = idx;
        renderPage(currentPage);
        var book = document.getElementById('book');
        if (book) {
            var top = book.getBoundingClientRect().top + window.pageYOffset - 20;
            setTimeout(function() { window.scrollTo({ top: top, behavior: 'smooth' }); }, 100);
        }
    }

    // ===== Audio =====
    function togglePlay() {
        if (!currentAudio) return;
        const btn = document.getElementById('playBtn');
        if (isPlaying) {
            currentAudio.pause();
            btn.textContent = '▶';
            btn.classList.remove('playing');
        } else {
            currentAudio.play();
            btn.textContent = '⏸';
            btn.classList.add('playing');
        }
        isPlaying = !isPlaying;
    }

    function updateAudioProgress() {
        if (!currentAudio || !currentAudio.duration) return;
        const pct = (currentAudio.currentTime / currentAudio.duration) * 100;
        const fill = document.getElementById('progressFill');
        const time = document.getElementById('audioTime');
        if (fill) fill.style.width = pct + '%';
        if (time) time.textContent = formatTime(currentAudio.currentTime);
    }

    function seekAudio(e) {
        if (!currentAudio || !currentAudio.duration) return;
        const bar = document.getElementById('progressBar');
        const rect = bar.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        currentAudio.currentTime = pct * currentAudio.duration;
    }

    function formatTime(s) {
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    var MSG_PAL = ['#FFF5F8','#F8F5FF','#F0FFF8','#FFF8F0','#FFFFF0','#F5F0FF','#FFF0F5','#F0F8FF','#FFF5E8','#F0FFF0','#FFE8F5','#E8F5FF','#FFF0E8','#E8FFE8','#F5FFE8','#FFE8E8','#F5F0FF','#FFF0F5','#F0FFF0','#FFF8F5','#E8F0FF','#FFE8F0','#F0FFE8','#E8E8FF','#FFFFF5','#F5FFFF','#FFF5E0','#E0FFF5','#FFE0F5','#F5E0FF','#FFF0E0','#E0F0FF'];

    async function loadMessages() {
        var container = document.getElementById('bubblesOverlay');
        var messages = [];

            var { data, error } = await supabaseClient.from('messages').select('*').order('id', { ascending: false });

        } catch(e) {

        }

    function animateBubbles() {
        var bubbles = document.querySelectorAll('#bubblesOverlay .bubble');
        if (bubbles.length === 0) return;
        var count = bubbles.length;
        var cols = Math.min(4, count);
        var rows = Math.ceil(count / cols);
        var spacingX = 240;
        var spacingY = 140;
        var startX = -((cols - 1) * spacingX) / 2;
        var startY = -((rows - 1) * spacingY) / 2;

        var cx = window.innerWidth / 2;
        var cy = Math.max(window.innerHeight / 2, 300);

        bubbles.forEach(function(b, i) {
            var col = i % cols;
            var row = Math.floor(i / cols);
            var tx = cx + startX + col * spacingX + (Math.random() - 0.5) * 20;
            var ty = cy + startY + row * spacingY + (Math.random() - 0.5) * 15 + 20;
            b.style.left = tx + 'px';
            b.style.top = ty + 'px';

            var edge = Math.floor(Math.random() * 4);
            var vw = window.innerWidth;
            var vh = window.innerHeight;
            var sxOff, syOff;
            if (edge === 0) { sxOff = Math.random() * vw; syOff = -150 - Math.random() * 300; }
            else if (edge === 1) { sxOff = vw + 150 + Math.random() * 300; syOff = Math.random() * vh; }
            else if (edge === 2) { sxOff = Math.random() * vw; syOff = vh + 150 + Math.random() * 300; }
            else { sxOff = -150 - Math.random() * 300; syOff = Math.random() * vh; }
            b.style.transform = 'translate(' + sxOff + 'px, ' + syOff + 'px)';
            b.style.opacity = '0';
        });

        requestAnimationFrame(function() {
            bubbles.forEach(function(b) {
                b.style.transition = 'transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.8s ease';
                b.style.transform = 'translate(0, 0)';
                b.style.opacity = '1';
            });
        });

        setTimeout(function() {
            bubbles.forEach(function(b) {
                b.style.transition = 'opacity 0.4s ease';
                b.style.animation = 'bubbleCenterHold 5s ease-in-out forwards';
            });

            setTimeout(function() {
                bubbles.forEach(function(b, i) {
                    b.style.animation = 'none';
                    void b.offsetHeight;
                    var angle = Math.random() * Math.PI * 2;
                    var dist = 400 + Math.random() * 600;
                    var dx = Math.cos(angle) * dist;
                    var dy = Math.sin(angle) * dist - 200;
                    b.style.transition = 'transform 1.2s ease-out, opacity 1.2s ease-out';
                    b.style.transform = 'translate(' + dx + 'px, ' + dy + 'px)';
                    b.style.opacity = '0';
                });

                setTimeout(function() {
                    bubbles.forEach(function(b) { b.remove(); });
                }, 1800);
            }, 5000);
        }, 1200);
    }

    // ===== Confetti =====
    function launchConfetti(count) {
        count = count || 50;

        for (let i = 0; i < count; i++) {

            el.style.cssText = `left:${Math.random()*100}vw;background:${colors[i%colors.length]};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;transform:rotate(${Math.random()*360}deg)`;
            document.body.appendChild(el);
            el.addEventListener('animationend', () => el.remove());
            setTimeout(() => { if (el.parentNode) el.remove(); }, 5000);
        }
    }

// ===== Touch swipe =====
